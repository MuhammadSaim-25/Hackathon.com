<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HCM Lite | Signup </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="stage tall">
        <img class="bg" src="./Images/background.jpg" alt="">

        <a class="brand" href="index.html">
            <span class="brand-text">HCM Lite</span>
        </a>

        <section class="login">
            <form class="card compact" action="#" method="post">
                <h1>Create Account</h1>
                <p class="sub">Please fill in your details</p>

                <label for="fullname">Full name</label>
                <input id="fullname" name="fullname" type="text" placeholder="Enter your full name" autocomplete="name"
                    required>

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="youremail@company.com" autocomplete="email"
                    required>

                <label for="phone">Phone number</label>
                <input id="phone" name="phone" type="tel" placeholder="+92 300 1234567" autocomplete="tel"
                    pattern="[0-9+\s\-]{7,15}" required>

                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username"
                    minlength="4" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="At least 8 characters"
                    autocomplete="new-password" minlength="8" required>

                <label for="confirm">Confirm password</label>
                <input id="confirm" name="confirm" type="password" placeholder="Re-enter your password"
                    autocomplete="new-password" minlength="8" required>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
                </label>

                <button type="submit">Create account</button>
            </form>

            <p class="new">Already have an account? <a href="./index.html">Sign in</a></p>
        </section>
    </main>
</body>

</html>
