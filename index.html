<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <!-- Building photo (right side) -->
    <img class="bg" src="Images/background.jpg" alt="Background images">

    <!-- Logo -->
    <a class="brand" href="#>
      <img src="images/logo.svg" alt="" width="30" height="26">
      <span class="brand-text">NovaNest</span>
    </a>

    <!-- Login -->
    <section class="login">
      <form class="card" action="#" method="post">
        <h1>Login</h1>
        <p class="sub">Please enter your details</p>

        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">

        <a class="forgot" href="#">Forgot password?</a>

        <button type="submit">Sign in</button>
      </form>
        <p class="new">Are you new? <a href="#">Create an Company Account</a></p>
    </section>
  </main>
</body>
</html>
